```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profitability & Margins Calculator</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;

    background-image:url('background.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    font-family:"Times New Roman", sans-serif;
}

.top-header{
    width:100%;
    background:#0d47a1;
    color:white;
    padding:25px 40px;
    font-size:40px;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.sub-header{
    width:100%;
    background:#FFA700;
    color:white;
    padding:15px 40px;
    font-size:25px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.main-content{
    flex:1;
    display:flex;
    justify-content:space-between;
    gap:40px;
    padding:40px 60px;
}

.calculator-panel{
    width:650px;
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.section-title{
    font-size:28px;
    color:#0d47a1;
    font-weight:bold;
    margin-bottom:25px;
}

.info-box{
    background:#f5f7fa;
    border-left:5px solid #FFA700;
    padding:15px;
    margin-bottom:25px;
    border-radius:8px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:5px;
}

input[type="number"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.calc-btn{
    width:100%;
    margin-top:25px;
    padding:16px;
    border:none;
    border-radius:14px;
    cursor:pointer;

    background:linear-gradient(
        135deg,
        #1565c0,
        #0d47a1
    );

    color:white;
    font-size:18px;
    font-weight:bold;

    box-shadow:0 6px 15px rgba(0,0,0,.25);

    transition:.25s;
}

.calc-btn:hover{
    background:linear-gradient(
        135deg,
        #1976d2,
        #0b3c91
    );

    transform:translateX(8px) scale(1.03);
}

.result{
    margin-top:25px;
    padding:20px;
    border-radius:10px;
    background:#f8f8f8;
    font-size:18px;
    line-height:1.7;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.right-panel{
    width:600px;
}

.iframe-container{
    width:100%;
    height:700px;
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.iframe-container iframe{
    width:100%;
    height:100%;
    border:none;
}

.loader-container{
    display:flex;
    justify-content:center;
    margin-top:20px;
}

.loader{
    width:70px;
    height:70px;
    border:8px solid #ddd;
    border-top:8px solid #1565c0;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

footer{
    width:100%;
    background:#111;
    color:#ccc;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 20px;
    border-top:2px solid #222;
}

.footer-btn{
    background:#0d47a1;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

.footer-btn:hover{
    background:#1565c0;
}

.status-good{
    color:green;
    font-weight:bold;
}

.status-warning{
    color:orange;
    font-weight:bold;
}

.status-bad{
    color:red;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="top-header">
    Pallet-Profitability-Calculator
</div>

<div class="sub-header">
    Profitability & Margins Calculator
</div>

<div class="main-content">

    <div class="calculator-panel">

        <div class="section-title">
            Margin Analysis Tool
        </div>

        <div class="info-box">
            Analyse supplier quotes, logistics costs and pallet profitability.
        </div>

        <label>Customer Sale Value (£)</label>
        <input id="sale" type="number" step="0.01">

        <label>Supplier Quote (£)</label>
        <input id="purchasecost" type="number" step="0.01">

        <label>Number of Pallets</label>
        <input id="pallet" type="number">

        <label>Current Warehouse Hours</label>
        <input id="warehouse" type="number">

        <label>Future Warehouse Hours</label>
        <input id="warehousefuture" type="number">

        <label>Lorry Cost (£)</label>
        <input id="lorry" type="number" step="0.01">

        <button class="calc-btn" onclick="calculateProfit()">
            Calculate Profitability
        </button>

        <div class="result" id="result"></div>

    </div>

    <div class="right-panel">

        <div class="iframe-container">
            <iframe
                src="calculator.html"
                title="Calculator Reference">
            </iframe>
        </div>

        <div class="loader-container">
            <div class="loader"></div>
        </div>

    </div>

</div>

<footer>

    <div>
        © 2026 Pallet Profitability Calculator | Internal Sales Tools Dashboard
    </div>

    <button
        class="footer-btn"
        onclick="location.href='index.html'">
        Back To Menu
    </button>

</footer>

<script>

function calculateProfit() {

    let sale =
        parseFloat(document.getElementById("sale").value) || 0;

    let purchasecost =
        parseFloat(document.getElementById("purchasecost").value) || 0;

    let pallets =
        parseFloat(document.getElementById("pallet").value) || 0;

    let warehouse =
        parseInt(document.getElementById("warehouse").value) || 0;

    let warehousefuture =
        parseInt(document.getElementById("warehousefuture").value) || 0;

    let lorry =
        parseFloat(document.getElementById("lorry").value) || 0;

    if (pallets <= 0) {

        document.getElementById("result").innerHTML =
            "<span class='status-bad'>Number of pallets must be greater than zero.</span>";

        return;
    }

    let totalWarehouseHours =
        warehouse + warehousefuture;

    let warehouseCost =
        (totalWarehouseHours * 0.010238095238095239) + 4.24;

    let totalLogisticsCost =
        warehouseCost + lorry;

    let salePerPallet =
        sale / pallets;

    let supplierPerPallet =
        purchasecost / pallets;

    let logisticsPerPallet =
        totalLogisticsCost / pallets;

    let marginPerPallet =
        salePerPallet -
        supplierPerPallet -
        logisticsPerPallet;

    let totalProfit =
        sale -
        purchasecost -
        totalLogisticsCost;

    let statusMessage = "";

    if (marginPerPallet > 0) {

        statusMessage +=
            "<span class='status-good'>This purchase is profitable.</span><br>";

        if (marginPerPallet > 80) {

            statusMessage +=
                "<span class='status-good'>Margin exceeds £80 per pallet and is acceptable.</span>";

        } else {

            statusMessage +=
                "<span class='status-warning'>Profitable, but margin is below £80 per pallet.</span>";
        }

    } else {

        statusMessage +=
            "<span class='status-bad'>Choose a different supplier. This order is not profitable.</span>";
    }

    document.getElementById("result").innerHTML =

        "Total Warehouse Hours: " +
        totalWarehouseHours +
        "<br><br>" +

        "Warehouse Cost: £" +
        warehouseCost.toFixed(2) +
        "<br>" +

        "Total Logistics Cost: £" +
        totalLogisticsCost.toFixed(2) +
        "<br>" +

        "Sale Value Per Pallet: £" +
        salePerPallet.toFixed(2) +
        "<br>" +

        "Supplier Cost Per Pallet: £" +
        supplierPerPallet.toFixed(2) +
        "<br>" +

        "Logistics Cost Per Pallet: £" +
        logisticsPerPallet.toFixed(2) +
        "<br>" +

        "Profit Per Pallet: £" +
        marginPerPallet.toFixed(2) +
        "<br><br>" +

        "<strong>Total Estimated Profit: £" +
        totalProfit.toFixed(2) +
        "</strong><br><br>" +

        statusMessage;
}

</script>

</body>
</html>
