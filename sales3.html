
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pallet-profitability-calculator</title>

  <style>

    .iframe-container {
      position: fixed;
      right: 20px;
      top: 10px;
      width: 600px;
      height: 800px;
      background: white;
      border: 3px solid black;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .loader-container {
      position: fixed;
      right: 300px;
      top: 75%;
      transform: translateY(-5%);
    }

    .loader {
      width: 100px;
      height: 100px;
      border: 12px solid #dcdcdc;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .footer {
      margin-top: 300px;
      text-align: center;
      font-size: 14px;
      color: blue;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: #1ca3ec;
      font-family: "Comic Sans MS", sans-serif;
      padding: 20px;
    }

    .top-text {
      text-decoration: underline;
      color: orange;
      font-weight: bold;
      font-style: italic;
      font-size: 32px;
      background-color: brown;
      padding: 15px;
      display: inline-block;
      margin-bottom: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 550px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px 0;
      box-sizing: border-box;
    }

    label {
      font-weight: bold;
    }

    button {
      padding: 10px;
      width: 100%;
      background: orange;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.6;
    }

  </style>
</head>

<body>

  <div class="top-text">Welcome! Form:</div>

  <div class="box">
    <p>for sales team number 2 ------------------------------------------------------</p>
  </div>

  <div class="top-text">
    Pallet Profitability Calculator
  </div>

  <div class="box">

    <label>Customer Sale Value (£)</label>
    <input id="sale" type="number" step="0.01">

    <label>Supplier Quote (£)</label>
    <input id="purchasecost" type="number" step="0.01">

    <label>Number of Pallets</label>
    <input id="pallet" type="number">

    <label>Current Warehouse Hours</label>
    <input id="warehouse" type="number">

    <label>Future Warehouse Hours</label>
    <input id="warehousefuture" type="number">

    <label>Lorry Cost (£)</label>
    <input id="lorry" type="number" step="0.01">

    <button onclick="calculateProfit()">
      Calculate Profit
    </button>

    <div class="result" id="result"></div>

  </div>

  <script>

    function calculateProfit() {

      let sale =
        parseFloat(document.getElementById("sale").value) || 0;

      let purchasecost =
        parseFloat(document.getElementById("purchasecost").value) || 0;

      let pallets =
        parseFloat(document.getElementById("pallet").value) || 0;

      let warehouse =
        parseInt(document.getElementById("warehouse").value) || 0;

      let warehousefuture =
        parseInt(document.getElementById("warehousefuture").value) || 0;

      let lorry =
        parseFloat(document.getElementById("lorry").value) || 0;

      if (pallets <= 0) {

        document.getElementById("result").innerHTML =
          "<span style='color:red;'>Number of pallets must be greater than zero.</span>";

        return;
      }

      let totalWarehouseHours =
        warehouse + warehousefuture;

      let warehouseCost =
        (totalWarehouseHours * 0.010238095238095239) + 4.24;

      let totalLogisticsCost =
        warehouseCost + lorry;

      let salePerPallet =
        sale / pallets;

      let supplierPerPallet =
        purchasecost / pallets;

      let logisticsPerPallet =
        totalLogisticsCost / pallets;

      let marginPerPallet =
        salePerPallet -
        supplierPerPallet -
        logisticsPerPallet;

      let totalProfit =
        sale -
        purchasecost -
        totalLogisticsCost;

      let statusMessage = "";

      if (marginPerPallet > 0) {

        statusMessage +=
          "<span style='color:green;'>This purchase is profitable.</span><br>";

        if (marginPerPallet > 80) {

          statusMessage +=
            "<span style='color:green;'>Margin exceeds £80 per pallet and is acceptable.</span>";

        } else {

          statusMessage +=
            "<span style='color:orange;'>Profitable, but margin is below £80 per pallet.</span>";
        }

      } else {

        statusMessage +=
          "<span style='color:red;'>Choose a different supplier. This order is not profitable.</span>";
      }

      document.getElementById("result").innerHTML =

        "Total Warehouse Hours: " +
        totalWarehouseHours +
        "<br><br>" +

        "Warehouse Cost: £" +
        warehouseCost.toFixed(2) +
        "<br>" +

        "Total Logistics Cost: £" +
        totalLogisticsCost.toFixed(2) +
        "<br>" +

        "Sale Value Per Pallet: £" +
        salePerPallet.toFixed(2) +
        "<br>" +

        "Supplier Cost Per Pallet: £" +
        supplierPerPallet.toFixed(2) +
        "<br>" +

        "Logistics Cost Per Pallet: £" +
        logisticsPerPallet.toFixed(2) +
        "<br>" +

        "Profit Per Pallet: £" +
        marginPerPallet.toFixed(2) +
        "<br><br>" +

        "<strong>Total Estimated Profit: £" +
        totalProfit.toFixed(2) +
        "</strong><br><br>" +

        statusMessage;
    }

  </script>

  <div class="loader-container">
    <div class="loader"></div>
  </div>

  <div class="iframe-container">
    <iframe
      src="calculator.html"
      title="praise the omnissiah this works">
    </iframe>
  </div>

</body>
</html>
