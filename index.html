<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Navigation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            font-family: "Times New Roman", sans-serif;
        }

        body.locked {
            overflow: hidden;
            pointer-events: none;
        }

        .top-header {
            width: 100%;
            background-color: #0d47a1;
            color: white;
            padding: 25px 40px;
            font-size: 40px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .sub-header {
            width: 100%;
            background-color: #FFA700;
            color: white;
            padding: 15px 40px;
            font-size: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 60px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nav-button {
            width: 220px;
            padding: 18px 25px;
            font-size: 18px;
            border: none;
            border-radius: 14px;
            cursor: pointer;

            background: linear-gradient(135deg, #1565c0, #0d47a1);
            color: white;

            font-weight: bold;
            letter-spacing: 0.5px;

            box-shadow: 0 6px 15px rgba(0,0,0,0.25);

            transition: all 0.25s ease;
        }

        .nav-button:hover {
            background: linear-gradient(135deg, #1976d2, #0b3c91);
            transform: translateX(16px) scale(1.30);
            box-shadow: 0 10px 20px rgba(0,0,0,0.35);
        }

        .nav-button:active {
            transform: scale(0.98);
        }

        .logo-container {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .logo-container img {
            max-width: 400px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 18px rgba(0,0,0,0.35));
        }

        footer {
            width: 100%;
            background-color: #111;
            color: #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            font-size: 14px;
            letter-spacing: 0.4px;
            border-top: 2px solid #222;
        }

        .footer-btn {
            background: #0d47a1;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .footer-btn:hover {
            background: #1565c0;
        }
        .cookie-popup {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
        }

        .cookie-popup button {
            margin-left: 10px;
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .accept {
            background: #2e7d32;
            color: white;
        }

        .decline {
            background: #c62828;
            color: white;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="top-header">
        Pallet-Profitability-Calculator-Index
    </div>

    <div class="sub-header">
        Select Your Calculator Formula Below
    </div>

    <div class="main-content">

        <div class="container">

            <button class="nav-button" onclick="location.href='sales1.html'">
                Sales Calculator
            </button>

            <button class="nav-button" onclick="location.href='sales2.html'">
                Stock Sales Calculator
            </button>

            <button class="nav-button" onclick="location.href='sales3.html'">
                Profitability and Margins Calculator
            </button>

        </div>

        <div class="logo-container">
            <img src="logo.png" alt="Company Logo">
        </div>

    </div>

    <footer>
        <div>© 2026 Pallet Profitability Calculator | Internal Sales Tools Dashboard, plese visit https://www.albanyproducts.co.uk/ for more on our business</div>

        <button class="footer-btn" onclick="location.href='terms.html'">
            Terms & Conditions
        </button>
    </footer>
    <div class="cookie-popup" id="cookiePopup">
        <div>
            This site uses cookies to function properly. Do you accept cookies to continue?
        </div>
        <div>
            <button class="accept" onclick="acceptCookies()">Accept</button>
            <button class="decline" onclick="declineCookies()">Decline</button>
        </div>
    </div>

    <script>
        function acceptCookies() {
            document.getElementById('cookiePopup').classList.add('hidden');
        }

        function declineCookies() {
            alert("Cookies are nessesary for your continued access to this site and its subdomains");
            document.body.innerHTML = "<h1 style='text-align:center;margin-top:50px;'>Access Denied</h1>";
        }
    </script>

</body>
</html>
