<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Team 2 Profit Calculator</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;

    background-image:url('background.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    font-family:"Times New Roman", sans-serif;
}

.top-header{
    width:100%;
    background:#0d47a1;
    color:white;
    padding:25px 40px;
    font-size:40px;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.sub-header{
    width:100%;
    background:#FFA700;
    color:white;
    padding:15px 40px;
    font-size:25px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.main-content{
    flex:1;
    display:flex;
    justify-content:space-between;
    gap:40px;
    padding:40px 60px;
}

.calculator-panel{
    width:650px;
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.section-title{
    font-size:28px;
    color:#0d47a1;
    font-weight:bold;
    margin-bottom:25px;
}

.info-box{
    background:#f5f7fa;
    border-left:5px solid #FFA700;
    padding:15px;
    margin-bottom:25px;
    border-radius:8px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:5px;
}

input[type="number"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.checkbox-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:15px;
}

.checkbox-row label{
    margin:0;
}

.calc-btn{
    width:100%;
    margin-top:25px;
    padding:16px;
    border:none;
    border-radius:14px;
    cursor:pointer;

    background:linear-gradient(135deg,#1565c0,#0d47a1);
    color:white;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 6px 15px rgba(0,0,0,.25);
    transition:.25s;
}

.calc-btn:hover{
    background:linear-gradient(135deg,#1976d2,#0b3c91);
    transform:translateX(8px) scale(1.03);
}

.result{
    margin-top:25px;
    padding:20px;
    border-radius:10px;
    background:#f8f8f8;
    font-size:18px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.right-panel{
    width:600px;
}

.iframe-container{
    width:100%;
    height:700px;
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.iframe-container iframe{
    width:100%;
    height:100%;
    border:none;
}

.loader-container{
    display:none;
    justify-content:center;
    margin-top:20px;
}

.loader{
    width:70px;
    height:70px;
    border:8px solid #ddd;
    border-top:8px solid #1565c0;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}

footer{
    width:100%;
    background:#111;
    color:#ccc;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 20px;
    border-top:2px solid #222;
}

.footer-btn{
    background:#0d47a1;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

.footer-btn:hover{
    background:#1565c0;
}

</style>
</head>

<body>

<div class="top-header">
    Pallet-Profitability-Calculator
</div>

<div class="sub-header">
    Sales Team 2 Profit Calculator
</div>

<div class="main-content">

    <div class="calculator-panel">

        <div class="section-title">
            Profitability Calculator
        </div>

        <div class="info-box">
            For Sales Team Number 2
        </div>

        <label>Total Purchasing Cost (£)</label>
        <input id="purchasecost" type="number">

        <label>Number of Pallets</label>
        <input id="pallet" type="number">

        <div class="checkbox-row">
            <input id="stackable" type="checkbox">
            <label>Stackable Pallets</label>
        </div>

        <label>Storage Hours</label>
        <input id="hours" type="number">

        <label>Lorry Cost (£)</label>
        <input id="lorry" type="number">

        <button class="calc-btn" onclick="calculateProfit()">
            Calculate Profit
        </button>

        <div class="result" id="result"></div>

        <div class="loader-container" id="loader">
            <div class="loader"></div>
        </div>

    </div>

    <div class="right-panel">

        <div class="iframe-container">
            <iframe src="calculator.html" title="Calculator Reference"></iframe>
        </div>

    </div>

</div>

<footer>

    <div>
        © 2026 Pallet Profitability Calculator | Internal Sales Tools Dashboard
    </div>

    <button class="footer-btn" onclick="location.href='index.html'">
        Back To Menu
    </button>

</footer>

<script>

function showLoader(show){
    document.getElementById("loader").style.display =
        show ? "flex" : "none";
}

function calculateProfit() {

    showLoader(true);

    setTimeout(() => {

        const deliverycost = 4.24;
        const averageSalePrice = 80;

        let purchasecost =
            parseFloat(document.getElementById("purchasecost").value) || 0;

        let pallet =
            parseFloat(document.getElementById("pallet").value) || 0;

        let hours =
            parseInt(document.getElementById("hours").value) || 0;

        let lorry =
            parseFloat(document.getElementById("lorry").value) || 0;

        let stackable =
            document.getElementById("stackable").checked;

        let revenue = pallet * averageSalePrice;
        let totaldelcost = deliverycost + (1.72 * hours);

        let transportCost = 0;

        if (stackable) {
            if (pallet <= 52) transportCost = lorry;
            else if (pallet <= 104) transportCost = lorry * 2;
            else {
                document.getElementById("result").innerHTML =
                    "<strong>We don't go that far yet.</strong>";
                showLoader(false);
                return;
            }
        } else {
            if (pallet <= 26) transportCost = lorry;
            else if (pallet <= 52) transportCost = lorry * 2;
            else {
                document.getElementById("result").innerHTML =
                    "<strong>What do you think this is?</strong>";
                showLoader(false);
                return;
            }
        }

        let profit =
            revenue - totaldelcost - transportCost - purchasecost;

        document.getElementById("result").innerHTML =
            "Revenue: £" + revenue.toFixed(2) + "<br>" +
            "Pallets: " + pallet + "<br>" +
            "Storage Cost: £" + totaldelcost.toFixed(2) + "<br>" +
            "Transport Cost: £" + transportCost.toFixed(2) + "<br>" +
            "Purchase Cost: £" + purchasecost.toFixed(2) + "<br><br>" +
            "<strong>Estimated Profit: £" + profit.toFixed(2) + "</strong>";

        showLoader(false);

    }, 500);
}

</script>

</body>
</html>
