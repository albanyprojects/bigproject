<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pallet Profitability Calculator</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --card-light: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent2: #f59e0b;
      --danger: #ef4444;
      --border: rgba(255,255,255,0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .page {
      width: 100%;
      max-width: 900px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-light);
      color: var(--text);
      margin-bottom: 14px;
      outline: none;
    }

    input[type="checkbox"] {
      transform: scale(1.2);
      margin-right: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #001018;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #0ea5e9;
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      background: var(--card-light);
      border: 1px solid var(--border);
      font-size: 15px;
      line-height: 1.5;
    }

    .profit {
      font-size: 18px;
      color: var(--accent2);
      font-weight: 700;
      margin-top: 10px;
    }

    .warning {
      color: var(--danger);
      font-weight: 600;
    }

    /* Right side iframe */
    .iframe-container {
      position: fixed;
      right: 20px;
      top: 20px;
      width: 420px;
      height: 700px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Loader */
    .loader-container {
      position: fixed;
      bottom: 20px;
      right: 460px;
    }

    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 1100px) {
      .iframe-container,
      .loader-container {
        display: none;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="title">Pallet Profitability Calculator</div>
    <div class="subtitle">Enter values below to estimate profit based on transport rules.</div>

    <div class="grid">

      <div class="card">

        <label>Base Sale Value (£)</label>
        <input id="sale" type="number">

        <label>Total Purchasing Cost (£)</label>
        <input id="purchasecost" type="number">

        <label>Number of Pallets</label>
        <input id="pallet" type="number">

        <label>Storage Hours</label>
        <input id="hours" type="number">

        <label>Lorry Cost (£)</label>
        <input id="lorry" type="number">

        <div class="row">
          <input id="stackable" type="checkbox">
          <label for="stackable">Stackable pallets</label>
        </div>

        <button onclick="calculateProfit()">Calculate Profit</button>

        <div class="result" id="result"></div>

      </div>

    </div>
  </div>

  <div class="iframe-container">
    <iframe src="calculator.html"></iframe>
  </div>

  <div class="loader-container">
    <div class="loader"></div>
  </div>

  <script>
    function calculateProfit() {

      const deliverycost = 4.24;

      let sale = parseFloat(document.getElementById("sale").value) || 0;
      let purchasecost = parseFloat(document.getElementById("purchasecost").value) || 0;
      let pallet = parseFloat(document.getElementById("pallet").value) || 0;
      let hours = parseInt(document.getElementById("hours").value) || 0;
      let lorry = parseFloat(document.getElementById("lorry").value) || 0;
      let stackable = document.getElementById("stackable").checked;

      let totaldelcost = deliverycost + (1.72 * hours);

      let transportCost = 0;

      if (stackable) {

        if (pallet <= 52) transportCost = lorry;
        else if (pallet <= 104) transportCost = lorry * 2;
        else {
          document.getElementById("result").innerHTML =
            "<span class='warning'>We don't go that far yet.</span>";
          return;
        }

      } else {

        if (pallet <= 26) transportCost = lorry;
        else if (pallet <= 52) transportCost = lorry * 2;
        else {
          document.getElementById("result").innerHTML =
            "<span class='warning'>Out of supported range.</span>";
          return;
        }
      }

      let profit = sale - totaldelcost - transportCost - purchasecost;

      document.getElementById("result").innerHTML =
        "Revenue: £" + sale.toFixed(2) + "<br>" +
        "Storage Cost: £" + totaldelcost.toFixed(2) + "<br>" +
        "Transport Cost: £" + transportCost.toFixed(2) + "<br>" +
        "Purchase Cost: £" + purchasecost.toFixed(2) + "<br><br>" +
        "<div class='profit'>Estimated Profit: £" + profit.toFixed(2) + "</div>";
    }
  </script>

</body>
</html>
