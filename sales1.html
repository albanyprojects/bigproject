<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pallet-profitability-calculator</title>

  <style>

    .iframe-container {
      position: fixed;
      right: 20px;
      top: 10px;
      width: 600px;
      height: 800px;
      background: white;
      border: 3px solid black;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .loader-container {
      position: fixed;
      right: 300px;
      top: 75%;
      transform: translateY(-5%);
    }

    .loader {
      width: 100px;
      height: 100px;
      border: 12px solid #dcdcdc;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .footer {
      margin-top: 300px;
      text-align: center;
      font-size: 14px;
      color: blue;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: #1ca3ec;
      font-family: "Comic Sans MS", sans-serif;
      padding: 20px;
    }

    .top-text {
      text-decoration: underline;
      color: orange;
      font-weight: bold;
      font-style: italic;
      font-size: 32px;
      background-color: brown;
      padding: 15px;
      display: inline-block;
      margin-bottom: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 550px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px 0;
      box-sizing: border-box;
    }

    label {
      font-weight: bold;
    }

    button {
      padding: 10px;
      width: 100%;
      background: orange;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }

  </style>
</head>

<body>

  <div class="top-text">Welcome! Form:</div>

  <div class="box">
    <p>for sales team number 1 ------------------------------------------------------</p>
  </div>

  <div class="top-text">
    Pallet Profitability Calculator
  </div>

  <div class="box">

    <label>Base Sale Value (£)</label>
    <input id="sale" type="number">

    <label>Total Purchasing Cost (£)</label>
    <input id="purchasecost" type="number">

    <label>Number of Pallets</label>
    <input id="pallet" type="number">

    <label>Stackable Pallets?</label>
    <input id="stackable" type="checkbox">

    <label>Storage Hours</label>
    <input id="hours" type="number">

    <label>Lorry Cost (£)</label>
    <input id="lorry" type="number">

    <button onclick="calculateProfit()">Calculate Profit</button>

    <div class="result" id="result"></div>

  </div>

  <script>

    function calculateProfit() {

      const deliverycost = 4.24;

      let sale = parseFloat(document.getElementById("sale").value) || 0;
      let purchasecost = parseFloat(document.getElementById("purchasecost").value) || 0;
      let pallet = parseFloat(document.getElementById("pallet").value) || 0;
      let hours = parseInt(document.getElementById("hours").value) || 0;
      let lorry = parseFloat(document.getElementById("lorry").value) || 0;

      let stackable = document.getElementById("stackable").checked;

      let totaldelcost = deliverycost + (1.72 * hours);

      let transportCost = 0;

      if (stackable) {

        if (pallet <= 52) {
          transportCost = lorry;
        }
        else if (pallet <= 104) {
          transportCost = lorry * 2;
        }
        else {
          document.getElementById("result").innerText =
            "We don't go that far yet.";
          return;
        }

      } else {

        if (pallet <= 26) {
          transportCost = lorry;
        }
        else if (pallet <= 52) {
          transportCost = lorry * 2;
        }
        else {
          document.getElementById("result").innerText =
            "What do you think this is?";
          return;
        }
      }

      let profit =
        sale -
        totaldelcost -
        transportCost -
        purchasecost;

      document.getElementById("result").innerHTML =
        "Revenue: £" + sale.toFixed(2) + "<br>" +
        "Storage Cost: £" + totaldelcost.toFixed(2) + "<br>" +
        "Transport Cost: £" + transportCost.toFixed(2) + "<br>" +
        "Purchase Cost: £" + purchasecost.toFixed(2) + "<br><br>" +
        "<strong>Estimated Profit: £" + profit.toFixed(2) + "</strong>";
    }

  </script>

  <div class="loader-container">
    <div class="loader"></div>
  </div>

  <div class="iframe-container">
    <iframe
      src="calculator.html"
      title="praise the omnisiah this works">
    </iframe>
  </div>

</body>
</html>
